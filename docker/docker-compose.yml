x-api-build: &api-build
  build:
    context: ../api
    dockerfile: Dockerfile
  restart: always

x-app-environment: &app-environment
  APP_ENV: production
  SECRET_KEY: ${SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  DATABASE_URL: postgresql+psycopg://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  MINIO_SECURE: ${MINIO_SECURE:-false}
  MINIO_BUCKET: ${MINIO_BUCKET:-ohmycode}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_MODEL_VERSION: ${EMBEDDING_MODEL_VERSION:-}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
  RERANK_URL: ${RERANK_URL:-}
  RERANK_API_KEY: ${RERANK_API_KEY:-}
  RERANK_MODEL: ${RERANK_MODEL:-}
  RETRIEVAL_HTTP_TIMEOUT: ${RETRIEVAL_HTTP_TIMEOUT:-30}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    entrypoint: ["/bin/sh", "/etc/nginx/render-nginx-config.sh"]
    environment:
      ENABLE_SSL: ${ENABLE_SSL:-false}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-server.crt}
      SSL_KEY_FILE: ${SSL_KEY_FILE:-server.key}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-20m}
      PROXY_TIMEOUT: ${PROXY_TIMEOUT:-3600s}
    ports:
      - "${EXPOSE_HTTP_PORT:-8765}:80"
      - "${EXPOSE_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/render-nginx-config.sh:/etc/nginx/render-nginx-config.sh:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *api-build
    environment:
      <<: *app-environment
      SERVER_WORKER_AMOUNT: ${SERVER_WORKER_AMOUNT:-1}
      SERVER_WORKER_CLASS: ${SERVER_WORKER_CLASS:-gevent}
      SERVER_WORKER_CONNECTIONS: ${SERVER_WORKER_CONNECTIONS:-10}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-360}
      GUNICORN_KEEP_ALIVE: ${GUNICORN_KEEP_ALIVE:-75}
    expose:
      - "8765"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *api-build
    command: ["uv", "run", "--no-sync", "celery", "-A", "celery_app:celery", "worker", "--loglevel=info"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync celery -A celery_app:celery inspect ping --destination celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  worker-beat:
    <<: *api-build
    command: ["uv", "run", "--no-sync", "celery", "-A", "celery_app:celery", "beat", "--loglevel=info", "--pidfile=/tmp/celerybeat.pid", "--schedule=/tmp/celerybeat-schedule"]
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
               -c 'statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-0}'
               -c 'idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}'
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./volumes/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./volumes/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
